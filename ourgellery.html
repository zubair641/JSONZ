<style>
.gallery-section{
  padding: 40px 20px;
  background: #f8f9fa;
}
.gallery-section h2{
  text-align:center;
  margin-bottom:25px;
  font-family: Poppins, sans-serif;
}
.gallery-grid{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
}
.gallery-box{
  width: 100%;
  height: 300px; /* Dabbe ki height fix */
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  border: 1px solid #eee;
}
.gallery-box img{
  width: 100% !important; /* Pora width dabbe ke andar */
  height: 100% !important;
  object-fit: cover; /* Agar pori pic bina cut ke chahiye to isko 'contain' kar do */
  object-position: center;
  display: block;
  transition: transform 0.4s ease;
}
.gallery-box:hover img{
  transform: scale(1.05);
}

/* Mobile ke liye */
@media(max-width: 600px){
  .gallery-box{ height: 250px; }
}
</style>
